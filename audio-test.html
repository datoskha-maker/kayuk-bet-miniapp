<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#081321">
<title>КАЮК SLICE — тест звука</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:#081321;color:#edf6ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:520px;margin:auto}h1{font-size:23px}p{color:#9db5ca;line-height:1.5}
.item{padding:15px;margin:12px 0;border:1px solid #29445d;border-radius:14px;background:#132337}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#397fb5;color:white;font-size:15px;font-weight:800}
.status{margin-top:9px;font-size:12px;color:#a9c4da;overflow-wrap:anywhere}.ok{color:#85e0ad}.bad{color:#ff9b9b}
small{color:#7894ac}
</style>
</head>
<body><main>
<h1>КАЮК SLICE — проверка озвучки</h1>
<p>Нажми по очереди каждую кнопку. Здесь воспроизводятся непосредственно загруженные MP3, без игрового кода.</p>
<div id="tests"></div>
<p><small>Если звук не играет, под кнопкой появится ошибка загрузки или воспроизведения.</small></p>
</main>
<script>
const files=[
 ['Фон','/audio/slice/background.mp3'],
 ['Разрезание — мяу','/audio/slice/slice.mp3'],
 ['Бомба — уву','/audio/slice/bomb.mp3'],
 ['Старт — яматэ кудасаи','/audio/slice/start.mp3']
];
const root=document.getElementById('tests');
files.forEach(([name,url],i)=>{
 const box=document.createElement('section');box.className='item';
 const button=document.createElement('button');button.textContent='▶ '+name;
 const status=document.createElement('div');status.className='status';status.textContent='Проверяем файл…';
 const audio=new Audio();audio.preload='auto';audio.src=url+'?diagnostic=20261111';
 audio.addEventListener('canplay',()=>{status.textContent='Файл загружен, готов к воспроизведению';status.className='status ok';},{once:true});
 audio.addEventListener('error',()=>{status.textContent='ОШИБКА ЗАГРУЗКИ: '+(audio.error?.code||'неизвестно')+' · '+url;status.className='status bad';});
 button.addEventListener('click',async()=>{
  try{audio.pause();audio.currentTime=0;await audio.play();status.textContent='ВОСПРОИЗВЕДЕНИЕ ЗАПУЩЕНО';status.className='status ok';}
  catch(e){status.textContent='ОШИБКА ВОСПРОИЗВЕДЕНИЯ: '+e.name+' — '+e.message;status.className='status bad';}
 });
 box.append(button,status);root.append(box);
});
</script></body></html>
