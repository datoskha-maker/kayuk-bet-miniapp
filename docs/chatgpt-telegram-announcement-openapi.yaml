openapi: 3.1.0
info:
  title: КАЮК BET Telegram Announcements
  version: 1.0.0
  description: Sends an administrator-authorized announcement to the КАЮК BET Telegram group.
servers:
  - url: https://kayuk-bet-miniapp-9nfa.vercel.app
paths:
  /api/telegram/announce:
    post:
      operationId: sendKayukBetAnnouncement
      summary: Send a message to the КАЮК BET Telegram group
      description: Publishes the supplied text as @aeslibaba_bot. Use only when the user explicitly asks to send or publish a message to the group.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - message
              properties:
                action:
                  type: string
                  enum:
                    - chatgpt_send
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Exact message text to publish, including emojis and line breaks.
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: integer
        '400':
          description: Invalid message
        '401':
          description: Unauthorized
        '502':
          description: Telegram rejected the message
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Secret
