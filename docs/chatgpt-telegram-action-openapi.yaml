openapi: 3.1.0
info:
  title: КАЮК BET Telegram Announcements
  version: 1.0.0
  description: Sends a plain-text announcement to the configured КАЮК BET Telegram group.
servers:
  - url: https://kayuk-bet-miniapp-9nfa.vercel.app
paths:
  /api/telegram/announce:
    post:
      operationId: sendGroupAnnouncement
      summary: Send a message to the КАЮК BET Telegram group
      description: Sends the supplied text to the single Telegram group configured on the server. The destination chat cannot be changed by the caller.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Exact text to send to the Telegram group.
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: integer
        '400':
          description: Missing or too-long message
        '401':
          description: Unauthorized
        '502':
          description: Telegram delivery failed
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
